<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>셀룰 학급살이</title>
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f3f7f2,#0f2219);--card:light-dark(#fff,#16301f);--ink:light-dark(#14231a,#eef5f0);--soft:light-dark(#40513f,#bfd2c5);
--board:#1f4d3a;--board2:#163b2c;--chalk:#ffd23f;--coral:#d9472f;--line:light-dark(#cfdcd2,#2f4e3b);--tint:light-dark(#e5f1e8,#1d3a28);
--c1:#c97a12;--c2:#2f7fc4;--c3:#7559c2;--c4:#cc4a72;--c5:#23855a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-weight:800;line-height:1.2;margin:0;text-wrap:balance}
.top{background:radial-gradient(120% 140% at 85% 20%,#2b6a4f 0,var(--board) 45%,var(--board2) 100%);color:#f6f9f4;padding:18px max(4vw,14px) 0}
.topin{max-width:1200px;margin:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.logo{font-size:clamp(32px,5vw,46px)}.logo b{color:var(--chalk)}
.who{font-size:17px;color:#e3eee6}.who b{color:var(--chalk)}
nav.tabs{max-width:1200px;margin:14px auto 0;display:flex;flex-wrap:wrap;gap:4px}
nav.tabs button{flex:1 1 118px;border:0;border-radius:12px 12px 0 0;background:rgba(0,0,0,.22);color:#f0f6f2;min-height:52px;font-weight:700}
nav.tabs button[aria-current=page]{background:var(--bg);color:var(--ink)}
main{max-width:1200px;margin:auto;padding:24px max(4vw,14px) 64px}
.lead{margin-bottom:16px}.lead h2{font-size:clamp(28px,4vw,38px)}.lead p{margin:6px 0 0;color:var(--soft);max-width:72ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}.card h3{font-size:22px;margin-bottom:8px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:860px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
button{font:inherit;font-size:18px;min-height:48px;padding:8px 18px;border-radius:12px;border:2px solid var(--board);background:var(--card);color:var(--ink);cursor:pointer}
button.main{background:var(--board);color:#fff}button.warn{border-color:var(--coral);color:var(--coral)}
button[disabled]{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
input,textarea,select{font:inherit;font-size:18px;width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}label{display:block;font-size:17px;color:var(--soft);margin:12px 0 4px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border-radius:99px;border:2px solid var(--line);font-size:17px}.chip[aria-pressed=true]{background:var(--board);border-color:var(--board);color:#fff}
.wx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.wx button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100px;border-color:var(--line);font-size:16px}
.wx button[aria-pressed=true]{border-color:var(--board);background:var(--tint)}.wx svg{width:44px;height:36px}
@media(max-width:520px){.wx{grid-template-columns:repeat(3,minmax(0,1fr))}}
.k{display:inline-block;font-size:15px;padding:2px 10px;border-radius:99px;color:#fff;white-space:nowrap;font-weight:700}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px}
.item .t{font-weight:800;font-size:19px}.small{font-size:16px;color:var(--soft)}
.alert{padding:12px 14px;border-radius:12px;background:light-dark(#fff0ec,#3a1c18);border:2px solid var(--coral);margin:10px 0}
.ok{padding:12px 14px;border-radius:12px;background:var(--tint);border:2px solid var(--c5);margin:10px 0}
.bar{display:grid;grid-template-columns:8.5em minmax(0,1fr) 2.6em;gap:10px;align-items:center;margin:8px 0}
.track{height:20px;border-radius:99px;background:var(--tint);overflow:hidden;display:flex}.fill{height:100%;transition:width .4s}
.n{text-align:right;font-variant-numeric:tabular-nums}
.board{background:radial-gradient(130% 120% at 10% 0,#2b6a4f,var(--board) 55%,var(--board2));color:#f6f9f4;border-radius:22px;padding:clamp(18px,3vw,30px);box-shadow:inset 0 0 0 10px #8a5a32,inset 0 0 0 12px #6d4425;margin-bottom:14px}
.board h3{font-size:clamp(26px,4vw,34px);color:var(--chalk)}.board ol{font-size:clamp(20px,2.6vw,25px);font-weight:800;line-height:1.5;padding-left:1.4em}.board li{margin:8px 0}
.board .why{display:block;font-size:16px;font-weight:400;color:#d6e6da}
.goal{margin-top:12px;background:rgba(0,0,0,.25);border-radius:14px;padding:12px 14px}.goal .track{background:rgba(255,255,255,.18);height:22px;margin-top:6px}
.log{border-left:4px solid var(--line);padding-left:14px;margin:10px 0}
.lv{font-size:15px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--tint)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:16px;color:var(--soft)}
tr.now td{background:var(--tint)}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0 12px}.steps4 span{padding:8px;border-radius:10px;background:var(--tint);font-size:15px;text-align:center}.steps4 span.on{background:var(--board);color:#fff}
.week{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.week button{text-align:left;min-height:84px;border-color:var(--line)}.week button[aria-pressed=true]{background:var(--tint);border-color:var(--board)}
@media(max-width:600px){.steps4,.week{grid-template-columns:repeat(2,minmax(0,1fr))}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{border:0;padding:4px 0}}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(92vw,560px);z-index:9;display:none}
#busy{position:fixed;top:0;left:0;right:0;height:5px;background:var(--chalk);display:none;z-index:9;animation:b 1s linear infinite}
@keyframes b{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
.start{max-width:760px;margin:auto}.bigbtn{width:100%;min-height:96px;font-size:24px;font-weight:800;margin-bottom:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="busy" role="status" aria-label="저장하는 중"></div>
<header class="top"><div class="topin"><h1 class="logo">셀<b>룰</b> <span style="font-size:.42em">학급살이</span></h1><div class="who" id="who"></div></div><nav class="tabs" id="tabs"></nav></header>
<main id="app"><p>불러오는 중이에요…</p></main>
<div id="toast"></div>
<script>
{
const SK=['자기인식','자기관리','사회적 인식','관계 기술','책임 있는 의사결정'];
const SKC={'자기인식':'var(--c1)','자기관리':'var(--c2)','사회적 인식':'var(--c3)','관계 기술':'var(--c4)','책임 있는 의사결정':'var(--c5)'};
const SUB={'자기인식':'감정 인식하기, 감정 유발 요인 알아차리기, 감정이 행동에 미치는 영향 알기, 강점과 한계 인정하기, 나의 가치 형성하기','자기관리':'생각·감정·행동 조절하기, 진정 기술(호흡 등) 쓰기, 충동 조절하기, 목표 세우고 긍정적 동기 유지하기','사회적 인식':'타인의 감정 알아차리고 공감하기, 다양한 관점 이해하기, 나와 다른 배경·문화 존중하기, 감사 표현하기','관계 기술':'경청하기, 관심소통(나-전달법, 되묻기), 협력하기, 갈등 원만하게 해결하기, 도움 청하고 주기','책임 있는 의사결정':'자신과 타인의 안녕을 생각해 결정하기, 결과 예측하기, 책임감 있게 문제 해결하기, 공동체에 기여하기'};
const BANK={
'12':{'자기인식':['속상할 때는 "나 지금 속상해"라고 마음 이름을 말해요','아침마다 내 마음 날씨를 알려요'],'자기관리':['화가 나면 숨을 세 번 쉬고 말해요','줄을 설 때는 차례를 기다려요'],'사회적 인식':['친구가 슬퍼 보이면 "괜찮아?" 물어봐요','도움을 받으면 "고마워"라고 말해요'],'관계 기술':['친구가 말할 때 눈을 보고 끝까지 들어요','혼자 있는 친구에게 "같이 놀자"고 말해요'],'책임 있는 의사결정':['내 물건은 제자리에 정리해요','쓰레기를 보면 먼저 주워요']},
'34':{'자기인식':['화가 날 때는 왜 화가 났는지 먼저 알아차려요','내가 잘하는 것으로 반을 도와요'],'자기관리':['교실과 복도에서는 걸어 다녀요','화가 날 때는 진정 코너에서 마음을 가라앉혀요'],'사회적 인식':['친구의 실수에는 웃음 대신 "괜찮아, 다시!"라고 말해요','속상한 친구에게는 마음과 그 이유를 함께 물어봐요'],'관계 기술':['친구 말이 끝나면 "네 말은 ~라는 거지?" 하고 되물어요','부탁할 때는 "나는 ~해서 ~해 주면 좋겠어"라고 말해요'],'책임 있는 의사결정':['모둠에서 맡은 일은 끝까지 해요','빌린 물건은 약속한 때에 돌려줘요']},
'56':{'자기인식':['내 감정이 행동에 어떤 영향을 주는지 돌아보고 말해요','나의 강점과 고칠 점으로 한 달 목표를 세워요'],'자기관리':['감정이 커지면 잠시 멈추고, 진정한 뒤 다시 이야기해요','쉬는 시간이 끝나면 1분 안에 자리에 앉아요'],'사회적 인식':['말하기 전에 상대 입장에서 한 번 더 생각해요','단체 대화방에서도 얼굴 보고 할 수 있는 말만 해요'],'관계 기술':['다른 의견도 끝까지 듣고, 요약한 다음 내 생각을 말해요','서운할 때는 나-전달법으로 말해요: "나는 ~해서 서운했어"'],'책임 있는 의사결정':['약속을 지키지 못했을 때는 스스로 회복 방법을 정해 실천해요','맡은 역할은 책임지고, 어려우면 도움을 청해요']}};
const WX=[['맑음','<circle cx="22" cy="18" r="10" fill="#f5b800"/>'],['구름 조금','<circle cx="16" cy="14" r="8" fill="#f5b800"/><ellipse cx="26" cy="22" rx="14" ry="8" fill="#b9c6ce"/>'],['흐림','<ellipse cx="22" cy="20" rx="17" ry="10" fill="#8d9ea8"/>'],['비','<ellipse cx="22" cy="14" rx="16" ry="9" fill="#7a8a95"/><path d="M14 26l-2 6M22 26l-2 6M30 26l-2 6" stroke="#2f7fc4" stroke-width="3" stroke-linecap="round"/>'],['천둥','<ellipse cx="22" cy="13" rx="16" ry="9" fill="#5f6e78"/><path d="M24 20l-6 8h6l-4 7" stroke="#f5b800" stroke-width="3" fill="none" stroke-linejoin="round"/>']];
const STR=['정리하기','말하기','듣기','그림·꾸미기','글쓰기','책 읽기','컴퓨터·기계','식물·동물','몸 움직이기','친구 돕기','기억하기','숫자·계산'];
const DEPT=['회장단','생활부','환경부','놀이부','소통부'];const LV=['수습','달인','명인'];
const STICK=['같이 놀아 줘서 고마워','기다려 줘서 고마워','도와줘서 고마워','고운 말 고마워'];
const RECOV=['사과 말하기','도움 행동 하기','다음에 쓸 방법 정하기'];
const WEEK=[['1주','마음 듣기·자기 체크','마음 날씨를 모으고 약속 지킴을 돌아봐요. 발견 카드는 매일 주고받아요.'],['2주','약속 회의','자치회가 안건을 내고 함께 투표해요.'],['3주','실천·달인 미션','바뀐 약속을 실천하고 역할을 해내요.'],['4주','성찰','잘 지킨 약속과 발견 카드를 돌아보고 다음 달 과제를 정해요.']];
const YEAR=[[3,'자기인식','나 알기, 마음 듣기, 약속 v1.0 제정, 1인 1달인 1기 배정'],[4,'자기관리','진정 기술 익히기, 자기 체크 습관, 첫 약속 회의'],[5,'사회적 인식','감사 표현, 친구 입장에서 약속 다시 보기, 발견 카드 시작, 자치회 부서 구성'],[6,'관계 기술','경청·관심소통 연습, 갈등 조정 약속, 1기 달인 인증'],[7,'책임 있는 의사결정','1학기 약속 돌아보기, 방학 나와의 약속'],[9,'자기인식·자기관리(심화)','2학기 재출발: 다시 나 알기, 약속 새단장(v2.0), 달인 2기와 멘토링'],[10,'사회적 인식(확장)','학교·지역사회·세계로 관점 넓히기(세계시민교육 연계)'],[11,'관계 기술(심화)','회복적 대화, 약속 해석 사례 모으기'],[12,'책임 있는 의사결정(심화)','자치회가 주도하는 개정, 우리 반 나눔 프로젝트'],[1,'다섯 역량 통합','약속 변천사 돌아보기, 나에게 쓰는 편지, 다음 학년 인계']];
const NEG=['안 지켰','안지켰','안 했','못 했','때문에','잘못','혼나','일렀','고자질'];

const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kt=s=>`<span class="k" style="background:${SKC[s]||'#666'}">${esc(s)}</span>`;
const gname=g=>({12:'1~2',34:'3~4',56:'5~6'})[g]+'학년';
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let busy=false;
function api(fn,...a){return new Promise((res,rej)=>{if(typeof google==='undefined'||!google.script)return rej(new Error('이 화면은 앱스 스크립트 웹 앱 주소로 열어야 작동해요.'));google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error((e&&e.message||String(e)).replace(/^Error:\s*/,''))))[fn](...a)})}
function toast(t,ok){const e=document.getElementById('toast');e.innerHTML=`<div class="${ok?'ok':'alert'}" role="alert">${esc(t)}</div>`;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3500)}
async function act(fn,args,okMsg,after){if(busy)return;busy=true;document.getElementById('busy').style.display='block';document.querySelectorAll('main button').forEach(b=>b.disabled=true);
 try{const r=await api(fn,...args);if(okMsg)toast(typeof okMsg==='function'?okMsg(r):okMsg,true);if(after)after(r);await reload()}catch(e){toast(e.message)}finally{busy=false;document.getElementById('busy').style.display='none';document.querySelectorAll('main button').forEach(b=>b.disabled=false);render()}}
const val=id=>(document.getElementById(id)?.value||'').trim();

let mode=null,me=store.get('selrule-me')||null,pw=null,S=null,T=null,PUB=null,tab=null,F={wx:'',ra:[],rb:[],stk:'',rs:0,rf:{act:[]}};
const STAB=[['mood','마음 듣기'],['promise','약속 제안·투표'],['board','약속판'],['cards','발견·회복'],['roles','1인 1달인'],['meeting','약속 회의'],['year','1년 지도'],['box','내 카드함']];
const TTAB=[['tset','학급 설정'],['tprom','약속 관리'],['troles','1인 1역 관리'],['tmeet','약속 회의'],['tstat','현황·피드백'],['year','1년 지도']];
async function reload(){if(mode==='s'&&me)S=await api('sState',me.code,me.num,me.pin,me.alias);if(mode==='t'&&pw)T=await api('tState',pw)}
function tabs(){const list=mode==='s'&&S?STAB:mode==='t'&&T?TTAB:[];document.getElementById('tabs').innerHTML=list.map(([k,l])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':''}>${l}</button>`).join('');
 document.getElementById('who').innerHTML=mode==='s'&&me?`<b>${esc(me.num)}번</b> · 별칭 <b>${esc(me.alias)}</b> <button data-change style="min-height:44px;margin-left:6px;background:transparent;color:#fff;border-color:rgba(255,255,255,.6)">로그아웃</button>`:mode==='t'&&T?`<b>교사 모드</b> <button data-out style="min-height:44px;margin-left:6px;background:transparent;color:#fff;border-color:rgba(255,255,255,.6)">나가기</button>`:''}
function render(){tabs();const app=document.getElementById('app');
 if(!mode)app.innerHTML=startView();else if(mode==='s'&&!S)app.innerHTML=joinView();else if(mode==='t'&&!T)app.innerHTML=loginView();else app.innerHTML=(V[tab]||V[mode==='s'?'mood':'tset'])()}

 if('join' in d){const code=val('jc'),num=val('jn'),pin=val('jp'),alias=val('ja');F.j={code,num:+num,alias};if(!code||!num||!pin||!alias)return toast('학급 코드, 출석번호, 인증 번호, 별칭을 모두 넣어 주세요.');if(!/^\d{4}$/.test(pin))return toast('인증 번호는 숫자 4자리예요.');busy=true;try{S=await api('sState',code,num,pin,alias);me={code,num:+num,pin,alias};store.set('selrule-me',me);tab='mood'}catch(err){toast(err.message)}busy=false;return render()}
 if('setup' in d){const p=val('tp'),c=val('tc');if(!p||!c)return toast('비밀번호와 학급 코드를 모두 써 주세요.');busy=true;try{await api('tSetup',p,c);pw=p;T=await api('tState',pw);tab='tset';toast('학급을 만들었어요. 학생 수와 학년군을 확인해 주세요.',true)}catch(err){toast(err.message)}busy=false;return render()}
 if('login' in d){const p=val('tp');if(!p)return toast('비밀번호를 써 주세요.');busy=true;try{T=await api('tState',p);pw=p;tab='tset'}catch(err){toast(err.message)}busy=false;return render()}
 /* 학생 */
 if(d.wx){F.mw=val('mw');F.ms=val('ms');F.wx=d.wx;return render()}
 if('mood' in d){F.mw=val('mw');F.ms=val('ms');if(!F.wx)return toast('마음 날씨를 먼저 골라 주세요.');return act('sMood',[me.code,me.num,me.pin,me.alias,F.wx,F.mw,F.ms],'고마워요! 마음이 잘 전해졌어요.',()=>{F.wx='';F.mw='';F.ms=''})}
 if(d.take){const[k,...r]=d.take.split('|');document.getElementById('pt').value=r.join('|');document.getElementById('pk').value=k;document.getElementById('pt').focus();return}
 if('propose' in d){const tx=val('pt');if(!tx)return toast('약속을 먼저 써 주세요.');if(/하지\s?(마|말|않)/.test(tx)&&t.dataset.c!=='1'){t.dataset.c='1';return toast('"~하지 마요"보다 "~해요"처럼 바라는 행동으로 바꾸면 지키기 쉬워요. 그대로 내려면 한 번 더 눌러 주세요.')}
  return act('sPropose',[me.code,me.num,me.pin,tx,val('pk'),val('pw2'),val('pr')],'약속을 제안했어요!')}
 if(d.vote)return act('sVote',[me.code,me.num,me.pin,d.vote],'한 표를 넣었어요.')
 if(d.self){const[i,r]=d.self.split('|');return act('sSelf',[me.code,me.num,me.pin,me.alias,S.board.items[+i].t,r],r==='a'?'멋져요! 셀이 자랐어요.':'솔직하게 돌아봐 줘서 고마워요.')}
 if(d.stk){F.stk=d.stk;return render()}
 if('card' in d){const to=val('ct');if(!to)return toast('받는 친구 번호를 골라 주세요.');const tx=S.grade==='12'?F.stk:S.grade==='34'?(val('cm')?val('cm')+' 고마워':''):(val('cm')&&val('ce')?val('cm')+' → '+val('ce'):'');
  if(!tx)return toast(S.grade==='12'?'마음 스티커를 골라 주세요.':'카드 내용을 채워 주세요.');if(NEG.some(w=>tx.includes(w)))return toast('발견 카드는 좋은 모습만 보내요. 친구가 잘한 행동을 써 볼까요?');
  return act('sCard',[me.code,me.num,me.pin,to,val('cp'),tx],`${to}번 친구에게 발견 카드를 보냈어요!`,()=>{F.stk=''})}
 if(d.rs!=null){keepRf();F.rs=+d.rs;return render()}
 if(d.rc){keepRf();F.rf.act=F.rf.act.includes(d.rc)?F.rf.act.filter(x=>x!==d.rc):[...F.rf.act,d.rc];return render()}
 if('rsave' in d){keepRf();const r=F.rf;return act('sRecov',[me.code,me.num,me.pin,me.alias,r.p||0,r.q1||'',r.q2||'',r.q3||'',r.act,r.q4||'',!!r.talk],'회복 카드를 냈어요. 다시 시작하는 용기, 멋져요.',()=>{F.rf={act:[]};F.rs=0})}
 if(d.str){const[w,s]=d.str.split('|');const k=w==='a'?'ra':'rb';F[k]=F[k].includes(s)?F[k].filter(x=>x!==s):[...F[k],s];return render()}
 if('rec' in d){if(!F.ra.length&&!F.rb.length)return toast('잘하는 일이나 하고 싶은 일을 하나 이상 골라 주세요.');F.rec=S.roles.map(r=>({n:r.name,v:(r.tags||[]).filter(x=>F.ra.includes(x)).length*2+(r.tags||[]).filter(x=>F.rb.includes(x)).length*2+(r.tags||[]).filter(x=>F.ra.includes(x)&&F.rb.includes(x)).length})).sort((a,b)=>b.v-a.v).slice(0,3).map(x=>x.n);render();return toast('추천 역할을 1~3지망에 넣었어요. 바꿔도 돼요.',true)}
 if('apply' in d){const list=[val('ap0'),val('ap1'),val('ap2')].filter(Boolean);if(!list.length)return toast('지원할 역할을 골라 주세요.');if(new Set(list).size!==list.length)return toast('같은 역할을 두 번 골랐어요.');return act('sApply',[me.code,me.num,me.pin,list],'역할에 지원했어요!',()=>{F.rec=null})}
 if('agenda' in d){const type=val('mt');if(type!=='폐지'&&!val('mx'))return toast('새 약속 문장을 써 주세요.');if(!val('mr'))return toast('제안 이유를 써 주세요.');return act('sAgenda',[me.code,me.num,me.pin,val('md'),type,val('mi'),val('mx'),val('mk'),val('mr')],'안건을 올렸어요!')}
 if(d.agv){const[id,yn]=d.agv.split('|');return act('sAgendaVote',[me.code,me.num,me.pin,id,yn],`${yn}에 투표했어요.`)}
 /* 교사 */
 if('tsave' in d)return act('tSaveCfg',[pw,{grade:val('sg'),size:val('ssz'),aliasCount:val('sal'),code:val('scd'),cycle:val('scy'),goal:val('sgo'),reward:val('srw')}],'설정을 저장했어요.')
 if('tpw' in d){const np=val('np');if(np.length<4)return toast('새 비밀번호는 4자 이상이에요.');return act('tChangePw',[pw,np],'비밀번호를 바꿨어요.',()=>{pw=np})}
 if('tnew' in d){if(t.dataset.c!=='1'){t.dataset.c='1';t.textContent='정말 지울까요? 한 번 더 누르면 모두 지워져요';return}return act('tNewYear',[pw],'새 학년도를 시작했어요.')}
 if(d.tadd){const[k,...r]=d.tadd.split('|');return act('tAddCand',[pw,r.join('|'),k,'추천 약속'],'후보에 넣었어요.')}
 if('tadd2' in d){if(!val('tt'))return toast('약속을 써 주세요.');return act('tAddCand',[pw,val('tt'),val('tk'),val('tb')],'후보에 넣었어요.')}
 if(d.trm)return act('tRemoveCand',[pw,d.trm],'후보에서 뺐어요.')
 if('enact' in d){const ids=[...document.querySelectorAll('[data-pick]:checked')].map(x=>x.dataset.pick);if(!ids.length)return toast('약속판에 올릴 약속을 체크해 주세요.');return act('tEnact',[pw,ids],'약속판에 올렸어요!')}
 if('radd' in d){F.roles=readRoles();F.roles.push({name:'',tags:[],cap:0});return render()}
 if(d.rdel!=null){F.roles=readRoles();F.roles.splice(+d.rdel,1);return render()}
 if('rsavelist' in d){const r=readRoles();if(r.some(x=>!x.name))return toast('이름이 빈 역할이 있어요.');return act('tRoles',[pw,r],'역할 목록을 저장했어요. 학생 화면에도 바로 반영돼요.',()=>{F.roles=null})}
 if('tauto' in d)return act('tAuto',[pw],n=>`${n}명을 배정했어요.`)
 if(d.asave){const n=d.asave;return act('tAssign',[pw,n,document.querySelector(`[data-asr="${n}"]`).value,document.querySelector(`[data-asl="${n}"]`).value],`${n}번 배정을 저장했어요.`)}
 if(d.pins){if(d.pins==='all'&&t.dataset.c!=='1'){t.dataset.c='1';t.textContent='모든 학생 번호가 바뀌어요. 한 번 더 누르면 새로 만들어요';return}return act('tMakePins',[pw,d.pins],d.pins==='missing'?'빠진 인증 번호를 만들었어요.':d.pins==='all'?'모든 인증 번호를 새로 만들었어요. 새 쪽지를 나눠 주세요.':`${d.pins}번 인증 번호를 새로 만들었어요.`)}
 if('slips' in d){F.slips=!F.slips;return render()}
 if(d.agdrop){if(t.dataset.c!=='1'){t.dataset.c='1';t.textContent='한 번 더 누르면 내려요';return}return act('tDropAgenda',[pw,d.agdrop],'안건을 내렸어요.')}
 if(d.decide)return act('tDecide',[pw,d.decide],r=>`안건이 ${r}되었어요.`)
 if(d.week!=null)return act('tSaveCfg',[pw,{week:d.week}],'')
 if('fb' in d){const n=val('fn'),a=val('fa');if(!n||!a)return toast('번호와 본 행동을 써 주세요.');const tx=[a,val('fb'),val('fc')].filter(Boolean).map(s=>s.replace(/[.!]+$/,'')).join('. ')+'.';return act('tFeedback',[pw,n,tx],`${n}번에게 피드백 카드를 보냈어요.`)}
});
async function refresh(){if(busy)return;const before=JSON.stringify(mode==='s'?S:T);try{await reload()}catch(e){return}const a=document.activeElement;if(JSON.stringify(mode==='s'?S:T)!==before&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()}
setInterval(()=>{if(document.visibilityState==='visible'&&(S||T))refresh()},60000);
async function enter(m){mode=m;tab=null;busy=true;render();try{PUB=await api(mode==='s'?'apiPublic':'tStatus');if(mode==='s'&&me&&PUB.ready){try{S=await api('sState',me.code,me.num,me.pin,me.alias);tab=tab||'mood'}catch(err){S=null;F.j={code:me.code,num:me.num,alias:me.alias};me=null;store.set('selrule-me',null);toast(err.message+' 다시 로그인해 주세요.')}}}catch(err){toast(err.message)}busy=false;render()}
if(me)enter('s');else render();
}
